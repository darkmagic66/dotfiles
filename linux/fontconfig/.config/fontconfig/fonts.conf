<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Thai: prefer Tlwg Mono (kitty uses its own symbol_map;
       this fixes every other app that currently falls back to Waree) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>th</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Tlwg Mono</string>
    </edit>
  </match>
</fontconfig>
