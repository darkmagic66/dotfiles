# hypridle.conf
# Idle daemon that triggers locking / events on inactivity and system events.
# It calls hyprlock via lock_cmd when a listener fires.
#
# TO ENABLE:
#   1. Install: paru -S hypridle
#   2. Uncomment the block(s) below you want.
#   3. Uncomment `hl.exec_cmd("hypridle")` in ~/.config/hypr/modules/autostart.lua
#   4. Reload Hyprland / restart session.

general {
    lock_cmd = hyprlock
    # unlock_cmd = hyprctl dispatch dpms on
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 5 minutes idle
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Optional: run command 10 seconds after the lock timeout (e.g. suspend or dpms off)
# listener {
#     timeout = 590
#     on-timeout = hyprctl dispatch dpms off
# }

# Lock on login-lock (e.g. loginctl lock-session)
# listener {
#     on-login-lock = hyprlock
# }

# Lock on lid close (laptop)
# listener {
#     on-lid-close = hyprlock
# }
