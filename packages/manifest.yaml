# Package manifest — single source of truth (4 machines, 4 package managers).
# Machine composition: common + <os> (linux|macos|windows) + optional role (role_personal|role_company)
common:
  - git
  - zsh
  - stow
  - tmux
  - jq
  - eza
  - gnupg
  - neovim
  - mise
  - atuin
  - htop
  - fd
  - fzf
  - zoxide
  - bat
  - ripgrep
  - zip
  - unzip
  - curl
  - wget
  - git-delta
  - tree-sitter-cli
  - lazygit

linux:     # pacman; arch-family only
  - kitty
  - waybar
  - yazi
  - awww
  - brightnessctl
  - wl-clipboard
  - powerline-fonts
  - ncdu
  - playerctl
  - udisks2
  - blueman
  - zed
  - fuzzel
  - notion-app-electron
  - firefox
  - brave-bin
  - bitwarden
  - opencode2-bin

macos_casks:    # brew --cask (alacritty excluded: Gatekeeper-blocked; kitty is the mac terminal)
  - kitty
  - firefox
  - brave-browser
  - bitwarden
  - visual-studio-code
  - zed
  - notion
  - raycast

macos_extra:    # brew formulas beyond common
  - xxh
  - tldr
  - asciinema
  - anomalyco/tap/opencode-v2   # opencode v2 (tap formula; mac only)

# (curl_scripts group retired — every supported OS now has a package-manager
# route: arch = AUR opencode2-bin, mac = brew tap formula)

role_personal:  # personal macs only (system-level tools; company M3 skips these)
  - aldente                       # menu-bar battery limiter (cask)
  - karabiner-elements            # key remapper (core cask)
  - nikitabobko/tap/aerospace     # tiling window manager (tap cask)
  - y3owk1n/tap/neru              # keyboard-driven mouse/hints (tap cask)

role_company: []  # company mac = common + macos only, no personal extras

windows:        # winget ids — sketch
  - Git.Git
  - junegunn.fzf
  - BurntSushi.ripgrep.MSVC
  - sharkdp.fd
  - Neovim.Neovim
  - Notion.Notion
  - Brave.Brave
  - Bitwarden.Bitwarden
