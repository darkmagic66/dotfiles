# Kitty terminal emulator - default for Hyprland

font_family      SFMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

window_padding_width 8
window_border_width 0

background_opacity 0.85
background_blur 1

scrollback_lines 100000
copy_on_select   yes

shell tmux new-session

# Wayland-native (auto-detected, explicit for clarity)
linux_display_server wayland

# Gruvbox dark colors (matches alacritty/tmux)
foreground              #ebdbb2
background              #1d2021
selection_foreground    #1d2021
selection_background    #ebdbb2

cursor                  #ebdbb2
cursor_text_color       #1d2021

color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
