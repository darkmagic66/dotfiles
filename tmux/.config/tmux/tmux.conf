unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind '"'
unbind %

bind | split-window -h
bind \\ split-window -v

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Terminal / colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g escape-time 0
set -g set-clipboard on
set -g default-command "${SHELL}"

# Titles
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'

# Vi mode + mouse
set -g status-keys vi
set-window-option -g mode-keys vi
set -g mouse on
setw -g mouse on

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# macOS PATH for server children (tpm!). GUI-launched kitty spawns the
# tmux server directly — no shell, no .zshrc, no brew shellenv — so run-shell
# children (tpm) fail with `tmux: command not found` and navigator bindings
# never load. Inject brew bin into tmux's global env (inherited by children).
# -d guard keeps Linux untouched. Reload with prefix+r; verify with
# `tmux show-environment -g PATH` and `tmux list-keys -T root | grep " C-h "`.
if-shell '[ -d /opt/homebrew/bin ]' 'set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/Applications/kitty.app/Contents/MacOS:/usr/bin:/bin:/usr/sbin:/sbin"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Statusbar (current red/yellow-on-black scheme)
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 20

set -g status-right-style 'fg=black bg=yellow'
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# Initialize TMUX plugin manager (keep at the very bottom)
run -b '~/.config/tmux/plugins/tpm/tpm'