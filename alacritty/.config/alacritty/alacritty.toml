[window]
startup_mode = "Maximized"
class = { instance = "Alacritty" }
opacity = 0.9

[scrolling]
history = 100000

[font]
size = 9.0

[font.normal]
family = "SFMono Nerd Font"
style = "Regular"

[font.bold]
family = "SFMono Nerd Font"
style = "Bold"

[font.italic]
family = "SFMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "SFMono Nerd Font"
style = "Bold Italic"

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[selection]
save_to_clipboard = true

# Uncomment to auto-attach tmux on launch:
# [terminal]
# shell = { program = "/bin/zsh", args = ["-l", "-c", "tmux attach || tmux"] }

[keyboard]
bindings = [
  { key = "PageUp",   mods = "Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown" },
  { key = "End",      mods = "Shift", action = "ScrollToBottom" },
  { key = "Home",     mods = "Shift", action = "ScrollToTop" },
  { key = "Q",        mods = "Control", action = "Quit" },
]